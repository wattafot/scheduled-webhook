name: Scheduled webhook

on:
  workflow_dispatch:
  schedule:
    - cron: '3/5 * * * *'
    - cron: '43 9 1 * *'

permissions: {}

concurrency:
  group: scheduled-webhook
  cancel-in-progress: false

jobs:
  invoke:
    if: vars.WEBHOOK_ENABLED == 'true' && github.event.schedule != '43 9 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke configured endpoint
        shell: bash
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$WEBHOOK_URL" != https://* || -z "$WEBHOOK_TOKEN" ]]; then
            echo 'Missing HTTPS endpoint or bearer token.' >&2
            exit 1
          fi
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          # Never publish response bodies, headers, or endpoint details in logs.
          # The overall deadline also bounds retries and backoff within this job.
          if ! status=$(timeout 240s curl --silent --fail \
            --output "$response" --write-out '%{http_code}' \
            --retry 2 --retry-all-errors --retry-max-time 200 \
            --connect-timeout 10 --max-time 180 \
            --request POST \
            --header "Authorization: Bearer $WEBHOOK_TOKEN" \
            "$WEBHOOK_URL"); then
            echo 'Endpoint invocation failed; check the private service logs.' >&2
            exit 1
          fi
          if [[ "$status" != '200' ]] || ! jq -e '.ok == true' "$response" >/dev/null 2>&1; then
            echo 'Endpoint did not confirm successful processing.' >&2
            exit 1
          fi
          echo 'Endpoint confirmed successful processing.'

  keep-active:
    # Public scheduled workflows stop after 60 days without repository activity.
    # A monthly timestamp commit keeps this timer active without private data.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '43 9 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Record scheduler activity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          endpoint="repos/$REPOSITORY/contents/maintenance/heartbeat.txt"
          sha=$(gh api "$endpoint" --jq '.sha')
          content=$(date -u '+%Y-%m-%dT%H:%M:%SZ' | base64 -w0)
          gh api --method PUT "$endpoint" \
            -f message='chore: record scheduler activity' \
            -f branch="$BRANCH" -f sha="$sha" -f content="$content" \
            --silent
